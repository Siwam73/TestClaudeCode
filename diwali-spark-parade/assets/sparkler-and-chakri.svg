<?xml version="1.0" encoding="UTF-8"?>
<!--
  Diwali Spark Parade — original hand-held sparkler + ground spinner (chakri) rigs.
  Sparkler origin = the grip end; the glowing tip, trails and glints are painted in code
  from the "tip" anchor so they stay soft and safe-looking.
  Chakri origin = spiral centre. The scene squashes "ground" vertically so the wheel lies
  flat on the floor, while "wheel" spins inside it.
  Same rig conventions as kids-original.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" width="600" height="330">
  <title>Original sparkler and chakri — cut-out rigs</title>
  <rect x="0" y="0" width="200" height="110" fill="#FFF7EA"/>

  <g id="sparkler" data-rig="sparkler" transform="translate(40 92)" stroke-linecap="round">
    <path d="M 0 2 L 0 -64" fill="none" stroke="#624239" stroke-width="3.6"/>
    <path d="M 0 2 L 0 -64" fill="none" stroke="#8E8088" stroke-width="1.6"/>
    <path d="M 0 -27 L 0 -64" fill="none" stroke="#624239" stroke-width="6.6"/>
    <path d="M 0 -27 L 0 -64" fill="none" stroke="#A39286" stroke-width="4.2"/>
    <path d="M -1 -31 L -1 -60" fill="none" stroke="#C9BBAE" stroke-width="1.1"/>
    <circle data-anchor="tip" cx="0" cy="-65" r="1" fill="none"/>
    <circle data-anchor="grip" cx="0" cy="0" r="1" fill="none"/>
  </g>

  <g id="chakri" data-rig="chakri" transform="translate(130 55)" stroke-linecap="round" stroke-linejoin="round">
