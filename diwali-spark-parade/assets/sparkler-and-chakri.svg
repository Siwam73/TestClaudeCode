        <path d="M 0 -17.8 C 1.8 -17.4 7.8 -17 10.9 -15 C 14 -13 17 -9.5 18.3 -6 C 19.7 -2.4 20 2.4 19 6.2 C 18 10 15.3 14.2 12.2 16.7 C 9 19.3 2 20.6 0 21.4" fill="none" stroke="#6269A0" stroke-width="5.2"/>
        <path d="M 0 21.4 C -2.2 20.8 -9.4 20.3 -13 17.9 C -16.6 15.5 -20.2 11.3 -21.7 7.1 C -23.3 2.9 -23.7 -2.8 -22.4 -7.3 C -21.2 -11.7 -18 -16.7 -14.3 -19.6 C -10.5 -22.6 -2.4 -24.1 0 -25" fill="none" stroke="#F2BB4B" stroke-width="5.2"/>
        <path d="M -9 13 L -7.5 15.5 M 12 5 L 15 5.6 M -3 -15.5 L -2.2 -18.6 M 7 -21.4 L 8 -24.2" fill="none" stroke="#FFF1CB" stroke-width="1.4"/>
        <circle cx="0" cy="0" r="3.8" fill="#F2BB4B" stroke="#624239" stroke-width="2"/>
        <path d="M 0 -25 L 4.5 -28.5" fill="none" stroke="#624239" stroke-width="2"/>
        <circle data-anchor="fuse" cx="4.8" cy="-28.8" r="1" fill="none"/>
      </g>
    </g>
  </g>
</svg>
