        <path d="M 0 -3.5 C 0.4 -3.5 1.7 -3.7 2.5 -3.4 C 3.3 -3.1 4.2 -2.4 4.7 -1.5 C 5.2 -0.7 5.5 0.6 5.4 1.7 C 5.2 2.9 4.6 4.3 3.7 5.2 C 2.8 6 0.6 6.8 0 7.1" fill="none" stroke="#F2BB4B" stroke-width="5.2"/>
