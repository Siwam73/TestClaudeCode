<?xml version="1.0" encoding="UTF-8"?>
<!--
  Diwali Spark Parade — original baby elephant rig ("Gullu").
  Side view facing screen-right; scenes mirror it when it needs to face left.
  Same rig conventions as kids-original.svg (data-part / data-pivot / data-bend / data-switch / data-anchor).
  Hand-authored for this project; no reference artwork was traced or copied.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="660" height="480">
  <title>Original baby elephant — cut-out rig</title>
  <rect x="0" y="0" width="220" height="160" fill="#FFF7EA"/>

  <g id="elephant" data-rig="elephant" transform="translate(100 146)" stroke-linejoin="round" stroke-linecap="round">

    <!-- tiny rope tail with a tuft -->
    <g data-part="tail" data-pivot="-50 -57" data-bend="-50 -57 -60 -36">
      <path d="M -49 -59 C -56 -55 -60 -48 -60 -39" fill="none" stroke="#624239" stroke-width="6.2"/>
      <path d="M -49 -59 C -56 -55 -60 -48 -60 -39" fill="none" stroke="#79B9C2" stroke-width="2.6"/>
      <path d="M -62.6 -41 C -65 -36 -64 -31.5 -60 -29.5 C -56.5 -31.5 -55.5 -36 -57.4 -41 Z" fill="#3B2A33" stroke="#624239" stroke-width="2"/>
    </g>

    <!-- far legs (shaded) -->
    <g data-part="legFB" data-pivot="-38 -34">
      <path d="M -47.5 -40 L -48 -6 C -48 -2 -45 0 -41.5 0 L -34 0 C -30.5 0 -28 -2 -28 -6 L -28.5 -40 Z" fill="#5F9FA9" stroke="#624239" stroke-width="3"/>
    </g>
    <g data-part="legFF" data-pivot="10 -34">
      <path d="M 0.5 -40 L 0 -6 C 0 -2 3 0 6.5 0 L 14 0 C 17.5 0 20 -2 20 -6 L 19.5 -40 Z" fill="#5F9FA9" stroke="#624239" stroke-width="3"/>
    </g>
    <!-- near legs with cream toenails -->
    <g data-part="legNB" data-pivot="-30 -32">
      <path d="M -40.5 -40 L -41 -6 C -41 -2 -38 0 -34.5 0 L -25.5 0 C -22 0 -19.5 -2 -19.5 -6 L -20 -40 Z" fill="#79B9C2" stroke="#624239" stroke-width="3"/>
      <path d="M -33.5 -0.6 C -33.5 -4.2 -29 -4.2 -29 -0.6 Z M -27.5 -0.6 C -27.5 -4.2 -23 -4.2 -23 -0.6 Z" fill="#FFF1CB" stroke="#624239" stroke-width="1.5"/>
    </g>
    <g data-part="legNF" data-pivot="20 -32">
      <path d="M 9.5 -40 L 9 -6 C 9 -2 12 0 15.5 0 L 24.5 0 C 28 0 30.5 -2 30.5 -6 L 30 -40 Z" fill="#79B9C2" stroke="#624239" stroke-width="3"/>
      <path d="M 17 -0.6 C 17 -4.2 21.5 -4.2 21.5 -0.6 Z M 23 -0.6 C 23 -4.2 27.5 -4.2 27.5 -0.6 Z" fill="#FFF1CB" stroke="#624239" stroke-width="1.5"/>
    </g>

    <!-- chubby rounded body -->
    <g data-part="body" data-pivot="-8 -16">
      <path d="M -53 -52 C -53 -74 -35 -87 -8 -87 C 18 -87 39 -74 39 -52 C 39 -30 20 -15 -8 -15 C -36 -15 -53 -30 -53 -52 Z" fill="#79B9C2" stroke="#624239" stroke-width="3"/>
      <path d="M -36 -26 C -26 -19.5 6 -19.5 18 -27 C 8 -23.5 -24 -23 -36 -26 Z" fill="#9CCDD3"/>
      <path d="M -44 -66 C -38 -77 -24 -82 -12 -82" fill="none" stroke="#9CCDD3" stroke-width="3"/>
      <!-- coral collar + the single gold bell -->
      <path d="M -1 -66 C 5 -55 14 -47 27 -43 L 27.5 -37.5 C 12.5 -41.5 2.5 -50.5 -5.5 -61 Z" fill="#E58D73" stroke="#624239" stroke-width="2.2"/>
      <g data-part="bell" data-pivot="23 -40">
        <path d="M 17.5 -31.5 C 17.5 -38 20 -41 23 -41 C 26 -41 28.5 -38 28.5 -31.5 L 30 -28.5 L 16 -28.5 Z" fill="#F2BB4B" stroke="#624239" stroke-width="2.2"/>
        <path d="M 20 -36.5 C 20.3 -38.3 21.2 -39.2 22.3 -39.4" fill="none" stroke="#FFF6CB" stroke-width="1.5"/>
        <circle cx="23" cy="-27.6" r="1.9" fill="#624239"/>
      </g>
    </g>

    <g data-part="head" data-pivot="14 -60">
      <path d="M 4 -80 C 4 -99 18 -111 36 -111 C 55 -111 69 -97 69 -80 C 69 -66 62 -55 51 -50 C 43 -46.5 30 -46 20 -50 C 9 -55 4 -66 4 -80 Z" fill="#79B9C2" stroke="#624239" stroke-width="3"/>
      <path d="M 42 -105 C 50 -104 58 -99 62 -92" fill="none" stroke="#9CCDD3" stroke-width="3"/>
      <!-- baby tuft -->
      <path d="M 31 -110 C 29 -116 31 -120.5 34.5 -120.5 M 36.5 -111 C 36.5 -118 39.5 -121.5 42.5 -119.5 M 41 -110 C 43 -115 46.5 -116.5 49 -114.5" fill="none" stroke="#624239" stroke-width="2.2"/>
      <!-- painted forehead dots -->
      <circle cx="56" cy="-99" r="1.7" fill="#FFF1CB"/>
      <circle cx="61" cy="-94" r="1.5" fill="#FFF1CB"/>
      <circle cx="51" cy="-102.5" r="1.4" fill="#FFF1CB"/>

      <!-- one oversized peach-lined ear -->
      <g data-part="ear" data-pivot="21 -84">
        <path d="M 24 -96 C 18 -113 -3 -117 -15 -104 C -25 -93 -23 -69 -13 -57 C -5 -49 10 -51 18 -59 C 24 -67 28 -84 24 -96 Z" fill="#79B9C2" stroke="#624239" stroke-width="3"/>
        <path d="M 19 -93 C 14 -106 0 -109.5 -8.5 -100.5 C -16.5 -92 -15.5 -73 -8 -64 C -2 -58 8 -59 13 -65 C 18 -72 22 -84 19 -93 Z" fill="#F2B3AE"/>
        <path d="M 8 -97 C 0 -97 -6 -90 -7 -82" fill="none" stroke="#E79B95" stroke-width="2"/>
      </g>

      <g data-part="eyes" data-switch="eyes" data-pivot="48 -82">
        <g data-state="open">
          <ellipse cx="48" cy="-82" rx="5" ry="6.8" fill="#2E1F2B"/>
          <circle cx="49.8" cy="-84.6" r="2" fill="#FFFFFF"/>
          <circle cx="46.6" cy="-79.2" r="0.95" fill="#FFFFFF"/>
          <path d="M 44 -86.5 L 41 -89.8 M 46.2 -88.4 L 45.1 -92" fill="none" stroke="#2E1F2B" stroke-width="1.7"/>
        </g>
        <g data-state="wide" display="none">
          <ellipse cx="48" cy="-83" rx="6" ry="8.2" fill="#2E1F2B"/>
          <circle cx="50.2" cy="-86" r="2.4" fill="#FFFFFF"/>
          <circle cx="46.2" cy="-79.6" r="1.1" fill="#FFFFFF"/>
          <path d="M 43.2 -88.5 L 40 -92 M 45.6 -90.6 L 44.5 -94.6" fill="none" stroke="#2E1F2B" stroke-width="1.7"/>
        </g>
        <g data-state="happy" display="none" fill="none" stroke="#2E1F2B" stroke-width="2.4">
          <path d="M 43 -80 Q 48 -87.5 53 -80"/>
          <path d="M 43.6 -82.6 L 40.6 -85.4" stroke-width="1.6"/>
        </g>
        <g data-state="closed" display="none" fill="none" stroke="#2E1F2B" stroke-width="2.2">
          <path d="M 43 -82 Q 48 -78 53 -82"/>
        </g>
      </g>
      <g data-part="brows" data-pivot="48 -94">
        <path d="M 43.5 -94 Q 48 -97.5 53 -94.5" fill="none" stroke="#624239" stroke-width="2.2"/>
      </g>
      <ellipse cx="57" cy="-66.5" rx="5.6" ry="3.4" fill="#F2B3AE"/>

      <g data-part="mouth" data-switch="mouth" data-pivot="49 -57">
        <g data-state="smile">
          <path d="M 44 -58.5 Q 48.5 -52.5 53.5 -57" fill="none" stroke="#624239" stroke-width="2.2"/>
        </g>
        <g data-state="open" display="none">
          <path d="M 43.5 -59 C 44.5 -52 51.5 -51 54 -57.5 C 50.5 -56 46.5 -56.5 43.5 -59 Z" fill="#7A3440" stroke="#624239" stroke-width="2"/>
        </g>
        <g data-state="o" display="none">
          <ellipse cx="49" cy="-56" rx="2.6" ry="3.3" fill="#7A3440" stroke="#624239" stroke-width="1.8"/>
        </g>
      </g>

      <!-- curled trunk: fill without a root edge so it melts into the head -->
      <g data-part="trunk" data-pivot="58 -66" data-bend="58 -66 90 -36">
        <path d="M 48.9 -67 C 49.3 -66.2 50.7 -63.7 51.5 -62 C 52.4 -60.3 53.2 -58.7 54 -57.1 C 54.8 -55.5 55.4 -54 56.1 -52.3 C 56.8 -50.6 57.5 -48.8 58.2 -47 C 59 -45.2 59.8 -43.4 60.7 -41.5 C 61.6 -39.7 62.5 -37.7 63.6 -35.9 C 64.7 -34.1 65.9 -32.4 67.5 -30.7 C 69.1 -29 70.9 -27.1 73 -25.9 C 75.2 -24.7 78 -23.8 80.5 -23.7 C 83.1 -23.6 86.1 -23.9 88.4 -25.2 C 90.8 -26.5 93.3 -29.4 94.5 -31.5 C 95.7 -33.6 95.9 -36.2 95.4 -37.7 C 95 -39.3 93.2 -40.4 91.9 -40.7 C 90.6 -40.9 88.5 -40.3 87.6 -39.3 C 86.7 -38.2 87.1 -35.5 86.6 -34.5 C 86 -33.5 85.4 -33.5 84.5 -33.3 C 83.7 -33.1 82.5 -33 81.4 -33.2 C 80.4 -33.4 79.3 -33.8 78.3 -34.5 C 77.4 -35.2 76.6 -36.2 75.8 -37.4 C 74.9 -38.6 74 -40 73.3 -41.5 C 72.6 -42.9 72.1 -44.4 71.5 -46 C 71 -47.6 70.4 -49.3 69.9 -51.1 C 69.4 -52.8 69 -54.6 68.5 -56.4 C 67.9 -58.3 67.3 -60.3 66.7 -62.2 C 66.1 -64.1 65.5 -65.9 64.9 -67.7 C 64.3 -69.5 63.4 -72.1 63.1 -73 Z" fill="#79B9C2"/>
        <path d="M 51.5 -62 C 52 -61.2 53.2 -58.7 54 -57.1 C 54.8 -55.5 55.4 -54 56.1 -52.3 C 56.8 -50.6 57.5 -48.8 58.2 -47 C 59 -45.2 59.8 -43.4 60.7 -41.5 C 61.6 -39.7 62.5 -37.7 63.6 -35.9 C 64.7 -34.1 65.9 -32.4 67.5 -30.7 C 69.1 -29 70.9 -27.1 73 -25.9 C 75.2 -24.7 78 -23.8 80.5 -23.7 C 83.1 -23.6 86.1 -23.9 88.4 -25.2 C 90.8 -26.5 93.3 -29.4 94.5 -31.5 C 95.7 -33.6 95.9 -36.2 95.4 -37.7 C 95 -39.3 93.2 -40.4 91.9 -40.7 C 90.6 -40.9 88.5 -40.3 87.6 -39.3 C 86.7 -38.2 87.1 -35.5 86.6 -34.5 C 86 -33.5 85.4 -33.5 84.5 -33.3 C 83.7 -33.1 82.5 -33 81.4 -33.2 C 80.4 -33.4 79.3 -33.8 78.3 -34.5 C 77.4 -35.2 76.6 -36.2 75.8 -37.4 C 74.9 -38.6 74 -40 73.3 -41.5 C 72.6 -42.9 72.1 -44.4 71.5 -46 C 71 -47.6 70.4 -49.3 69.9 -51.1 C 69.4 -52.8 69 -54.6 68.5 -56.4 C 67.9 -58.3 67.3 -60.3 66.7 -62.2 C 66.1 -64.1 65.2 -66.7 64.9 -67.7" fill="none" stroke="#624239" stroke-width="3"/>
        <path d="M 61.3 -44.5 Q 64.6 -47.6 69.1 -47.7 M 65.9 -35.5 Q 68.3 -38.9 72.4 -39.6 M 71.9 -28.5 Q 73 -32.3 76.6 -34" fill="none" stroke="#5F9FA9" stroke-width="1.6"/>
        <ellipse cx="91.6" cy="-39" rx="1.8" ry="1.2" fill="#3B2A33"/>
        <circle data-anchor="trunkTip" cx="92" cy="-41" r="1" fill="none"/>
      </g>
    </g>
  </g>
</svg>
